plugins {
    id 'java'
    id('com.gradleup.shadow') version '9.4.1'
    id 'xyz.jpenilla.run-paper' version "3.0.2"
}

group = 'net.mysterria.stuff'
version = '1.1.0'

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        url = "https://repo.hibiscusmc.com/releases/"
    }
    maven {
        url = "https://repo.triumphteam.dev/snapshots"
    }
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }

    maven {
        url = "https://nexus.mysterria.net/repository/plugin-public/"
    }

    // ZelChat does not currently publish a resolvable API artifact. Compile its
    // public API sources from an immutable GitHub commit instead of maintaining
    // a handwritten copy of the deployed plugin's classes.
    ivy {
        name = "zelchatGitHub"
        url = uri("https://github.com/ZelChat/zelchat-api/archive")
        patternLayout {
            artifact "[revision].zip"
        }
        metadataSources {
            artifact()
        }
        content {
            includeModule("it.pino.zelchat", "zelchat-api-source")
        }
    }
}

sourceSets {
    zelchatApi {
        java.srcDir(layout.buildDirectory.dir("generated/sources/zelchatApi"))
    }
}

configurations {
    zelchatApiCompileOnly.extendsFrom compileOnly
    zelchatApiSource
}

def zelchatApiCommit = "b32f3d240f1f8eb7216aa53556e01324d17372f6"
def zelchatApiArchiveSha256 = "27bf33f6439e6f074cac9ce56f49351cf7cecbedd965dc6873a52c45314e063c"
def zelchatApiArchiveRoot = "zelchat-api-${zelchatApiCommit}/src/main/java/"
def generatedZelchatApiSources = layout.buildDirectory.dir("generated/sources/zelchatApi")
def zelchatJarPath = providers.gradleProperty('zelchatJar')
sourceSets.main.compileClasspath += zelchatJarPath.isPresent()
        ? files(zelchatJarPath.get())
        : sourceSets.zelchatApi.output

if (!zelchatJarPath.isPresent()) {
    tasks.register('syncZelChatApiSources', Sync) {
        doFirst {
            File archive = configurations.zelchatApiSource.singleFile
            String actualSha256 = java.security.MessageDigest.getInstance("SHA-256")
                    .digest(archive.bytes)
                    .encodeHex()
                    .toString()
            if (actualSha256 != zelchatApiArchiveSha256) {
                throw new GradleException("Unexpected ZelChat public API archive checksum: ${actualSha256}")
            }
        }
        from({ zipTree(configurations.zelchatApiSource.singleFile) }) {
            include "${zelchatApiArchiveRoot}**/*.java"
            eachFile { details ->
                details.path = details.path.substring(zelchatApiArchiveRoot.length())
            }
            includeEmptyDirs = false
        }
        into generatedZelchatApiSources
    }
    tasks.compileZelchatApiJava.dependsOn(tasks.syncZelChatApiSources)
    tasks.compileJava.dependsOn(tasks.compileZelchatApiJava)
}

tasks.build.dependsOn(shadowJar)

dependencies {
    implementation("dev.triumphteam:triumph-gui-paper:3.1.13")
    compileOnly("dev.ua.ikeepcalm:circle-of-imagination-api:1.4.0-SNAPSHOT")
    compileOnly("de.skyslycer.hmcwraps:api:1.7.0")
    compileOnly("io.papermc.paper:paper-api:26.1.2.build.+")
    zelchatApiSource("it.pino.zelchat:zelchat-api-source:${zelchatApiCommit}@zip")
}

tasks {
    runServer {
        // Configure the Minecraft version for our task.
        // This is the only required configuration besides applying the plugin.
        // Your plugin's jar (or shadowJar if present) will be used automatically.
        minecraftVersion("1.21.11")
    }
}

def targetJavaVersion = 25
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}

tasks.register('verifyZelChatApiNotBundled') {
    dependsOn tasks.shadowJar
    doLast {
        def archive = tasks.shadowJar.archiveFile.get().asFile
        def bundled = zipTree(archive).matching {
            include 'it/pino/zelchat/api/**'
        }.files
        if (!bundled.empty) {
            throw new GradleException("ZelChat API classes must remain compile-only: ${bundled}")
        }
    }
}

tasks.check.dependsOn(tasks.verifyZelChatApiNotBundled)
